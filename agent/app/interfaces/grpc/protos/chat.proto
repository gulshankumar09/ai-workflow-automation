syntax = "proto3";

package ai-workflow-automation.chat;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Chat Service
service ChatService {
  // Start a new chat session
  rpc StartChatSession(StartChatSessionRequest) returns (StartChatSessionResponse);
  
  // Send a message and get streaming response
  rpc SendMessage(SendMessageRequest) returns (stream ChatMessageResponse);
  
  // Get chat history
  rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse);
  
  // End chat session
  rpc EndChatSession(EndChatSessionRequest) returns (EndChatSessionResponse);
  
  // Get session context
  rpc GetSessionContext(GetSessionContextRequest) returns (GetSessionContextResponse);
}

// Request Messages

message StartChatSessionRequest {
  string user_id = 1;
  SessionType session_type = 2;
  google.protobuf.Struct context = 3;
  repeated string capabilities = 4;
}

message SendMessageRequest {
  string session_id = 1;
  string message = 2;
  MessageType message_type = 3;
  google.protobuf.Struct metadata = 4;
  bool stream_response = 5;
}

message GetChatHistoryRequest {
  string session_id = 1;
  int32 limit = 2;
  string cursor = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
}

message EndChatSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message GetSessionContextRequest {
  string session_id = 1;
}

// Response Messages

message StartChatSessionResponse {
  string session_id = 1;
  SessionStatus status = 2;
  google.protobuf.Struct context = 3;
  repeated string available_tools = 4;
  string message = 5;
}

message ChatMessageResponse {
  string session_id = 1;
  string message_id = 2;
  string content = 3;
  MessageType message_type = 4;
  ResponseStatus status = 5;
  google.protobuf.Timestamp timestamp = 6;
  google.protobuf.Struct metadata = 7;
  bool is_final = 8;
  repeated ToolCall tool_calls = 9;
}

message GetChatHistoryResponse {
  repeated ChatMessage messages = 1;
  string next_cursor = 2;
  bool has_more = 3;
  int32 total_count = 4;
}

message EndChatSessionResponse {
  string session_id = 1;
  SessionStatus status = 2;
  string message = 3;
  google.protobuf.Timestamp ended_at = 4;
}

message GetSessionContextResponse {
  string session_id = 1;
  SessionStatus status = 2;
  google.protobuf.Struct context = 3;
  repeated string active_tools = 4;
  SessionMetrics metrics = 5;
}

// Data Models

message ChatMessage {
  string message_id = 1;
  string session_id = 2;
  string content = 3;
  MessageType message_type = 4;
  google.protobuf.Timestamp timestamp = 5;
  google.protobuf.Struct metadata = 6;
  repeated ToolCall tool_calls = 7;
}

message ToolCall {
  string tool_id = 1;
  string tool_name = 2;
  google.protobuf.Struct arguments = 3;
  string result = 4;
  ToolCallStatus status = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message SessionMetrics {
  int32 message_count = 1;
  int32 tool_calls_count = 2;
  google.protobuf.Timestamp session_duration = 3;
  int32 tokens_used = 4;
}

// Enums

enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  SESSION_TYPE_WORKFLOW = 1;
  SESSION_TYPE_CHAT = 2;
  SESSION_TYPE_TOOL_DISCOVERY = 3;
  SESSION_TYPE_ASSISTANCE = 4;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_USER = 1;
  MESSAGE_TYPE_ASSISTANT = 2;
  MESSAGE_TYPE_SYSTEM = 3;
  MESSAGE_TYPE_TOOL_CALL = 4;
  MESSAGE_TYPE_TOOL_RESULT = 5;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE = 1;
  SESSION_STATUS_ENDED = 2;
  SESSION_STATUS_ERROR = 3;
  SESSION_STATUS_TIMEOUT = 4;
}

enum ResponseStatus {
  RESPONSE_STATUS_UNSPECIFIED = 0;
  RESPONSE_STATUS_SUCCESS = 1;
  RESPONSE_STATUS_PROCESSING = 2;
  RESPONSE_STATUS_ERROR = 3;
  RESPONSE_STATUS_PARTIAL = 4;
}

enum ToolCallStatus {
  TOOL_CALL_STATUS_UNSPECIFIED = 0;
  TOOL_CALL_STATUS_PENDING = 1;
  TOOL_CALL_STATUS_SUCCESS = 2;
  TOOL_CALL_STATUS_ERROR = 3;
  TOOL_CALL_STATUS_TIMEOUT = 4;
} 