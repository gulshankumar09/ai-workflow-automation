server:
  port: 8082
  host: "localhost"
  read_timeout: "10m"
  write_timeout: "10m"
  idle_timeout: "120s"
  shutdown_timeout: "15s"
  enable_http2: true

grpc:
  core_service_addr: "localhost:50051"
  connection_timeout: "10s"
  request_timeout: "10m" # Increased from 30s to 10 minutes for streaming
  max_connection_idle: "30s"
  max_connection_age: "300s"
  keep_alive_time: "60s"
  keep_alive_timeout: "10s"
  max_receive_size: 4194304 # 4MB
  max_send_size: 4194304 # 4MB
  enable_tls: false

auth:
  # Auth0 Configuration
  auth0_domain: "dev-0vp5gf3sza2wrfbw.us.auth0.com"
  auth0_audience: "https://agent.ai-workflow-automation.ai/"
  auth0_client_id: "YMQLjCqsXhUDUh0T6OBCAka1W1zaujgF"
  jwks_cache_ttl: "1h"
  enable_rbac: false
  require_validation: true

supabase:
  url: "https://honqfepgbgdbjmzvevbe.supabase.co"
  anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbnFmZXBnYmdkYmptenZldmJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkxOTUxNTIsImV4cCI6MjA2NDc3MTE1Mn0.8JULzmnENdKmLtV1nvkkt-eGFT--_vByj-8ehV5v37U"
  service_role_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbnFmZXBnYmdkYmptenZldmJlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0OTE5NTE1MiwiZXhwIjoyMDY0NzcxMTUyfQ.N-5wsckD1EGznsIWvIyEc5WK5sNSrCs6R3wHtUpXvuQ" # This should be set via environment variable SUPABASE_SERVICE_ROLE_KEY
  users_table: "users"
  connection_timeout: "10s"
  query_timeout: "5s"

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst_size: 10
  cleanup_period: "1m"
  strategy: "memory"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:8082"
    - "http://127.0.0.1:8082"
    - "*" # Allow all origins for development (remove in production)
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"
    - "X-Request-ID"
    - "Accept"
    - "Accept-Language"
    - "Content-Language"
    - "X-Requested-With"
  exposed_headers:
    - "Content-Length"
    - "X-Request-ID"
  allow_credentials: true
  max_age: "12h"

database:
  max_connections: 25
  max_idle_connections: 10
  connection_timeout: "30s"
  query_timeout: "30s"

monitoring:
  enabled: true
  prometheus_enabled: true
  prometheus_port: 9090
  tracing_enabled: false
  tracing_sample_rate: 0.1
  health_check_path: "/health"
  readiness_check_path: "/health/ready"
  liveness_check_path: "/health/live"

logging:
  level: "debug" # Changed to debug for better error visibility
  format: "text" # Changed to text for easier reading during development
  output: "stdout"
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true

environment: "production"
